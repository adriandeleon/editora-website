<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Stand-in for a real Doctor screenshot. Drop a capture at
       public/screenshots/doctor.png and it replaces this automatically. -->
  <rect width="880" height="560" fill="#0d1117"/>

  <!-- window chrome -->
  <rect width="880" height="34" fill="#161b22"/>
  <line x1="0" y1="34" x2="880" y2="34" stroke="#30363d"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="17" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="17" r="5" fill="#27c93f"/>
  <text x="82" y="21" fill="#6e7681" font-size="11" font-family="ui-monospace, Menlo, monospace">Doctor — Editora</text>

  <!-- title + summary -->
  <text x="32" y="76" fill="#c9d1d9" font-size="22" font-weight="700">Doctor</text>
  <text x="32" y="99" fill="#8b949e" font-size="12.5">External tools Editora can use on this machine.</text>

  <g font-size="11.5" font-weight="600">
    <rect x="32" y="114" width="86" height="22" rx="11" fill="#238636" fill-opacity="0.18" stroke="#3fb950" stroke-opacity="0.5"/>
    <text x="75" y="129" fill="#3fb950" text-anchor="middle">12 found</text>
    <rect x="126" y="114" width="94" height="22" rx="11" fill="#d29922" fill-opacity="0.16" stroke="#d29922" stroke-opacity="0.5"/>
    <text x="173" y="129" fill="#d29922" text-anchor="middle">2 warnings</text>
    <rect x="228" y="114" width="92" height="22" rx="11" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.45"/>
    <text x="274" y="129" fill="#f85149" text-anchor="middle">1 missing</text>
  </g>

  <!-- ── section: Version control ── -->
  <text x="32" y="172" fill="#6e7681" font-size="10.5" font-weight="700" letter-spacing="1.2">VERSION CONTROL</text>
  <line x1="32" y1="180" x2="848" y2="180" stroke="#21262d"/>

  <circle cx="40" cy="203" r="5" fill="#3fb950"/>
  <text x="56" y="207" fill="#c9d1d9" font-size="13" font-weight="600">git</text>
  <text x="200" y="207" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, monospace">2.51.0</text>
  <text x="470" y="207" fill="#6e7681" font-size="11.5">/opt/homebrew/bin/git</text>

  <circle cx="40" cy="231" r="5" fill="#d29922"/>
  <text x="56" y="235" fill="#c9d1d9" font-size="13" font-weight="600">gh</text>
  <text x="200" y="235" fill="#d29922" font-size="12">found, not authenticated</text>
  <text x="470" y="235" fill="#6e7681" font-size="11.5">run: gh auth login</text>

  <!-- ── section: Search ── -->
  <text x="32" y="279" fill="#6e7681" font-size="10.5" font-weight="700" letter-spacing="1.2">SEARCH</text>
  <line x1="32" y1="287" x2="848" y2="287" stroke="#21262d"/>

  <circle cx="40" cy="310" r="5" fill="#3fb950"/>
  <text x="56" y="314" fill="#c9d1d9" font-size="13" font-weight="600">ripgrep</text>
  <text x="200" y="314" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, monospace">14.1.1</text>
  <text x="470" y="314" fill="#6e7681" font-size="11.5">accelerates Find in Files</text>

  <!-- ── section: Language servers ── -->
  <text x="32" y="358" fill="#6e7681" font-size="10.5" font-weight="700" letter-spacing="1.2">LANGUAGE SERVERS</text>
  <line x1="32" y1="366" x2="848" y2="366" stroke="#21262d"/>

  <circle cx="40" cy="389" r="5" fill="#3fb950"/>
  <text x="56" y="393" fill="#c9d1d9" font-size="13" font-weight="600">jdtls</text>
  <text x="200" y="393" fill="#8b949e" font-size="12">Java</text>
  <text x="470" y="393" fill="#6e7681" font-size="11.5">~/.editora/plugins/lsp/java/bin/jdtls</text>

  <circle cx="40" cy="417" r="5" fill="#3fb950"/>
  <text x="56" y="421" fill="#c9d1d9" font-size="13" font-weight="600">pyright-langserver</text>
  <text x="200" y="421" fill="#8b949e" font-size="12">Python</text>
  <text x="470" y="421" fill="#6e7681" font-size="11.5">~/.nvm/versions/node/v22/bin</text>

  <circle cx="40" cy="445" r="5" fill="#f85149"/>
  <text x="56" y="449" fill="#c9d1d9" font-size="13" font-weight="600">gopls</text>
  <text x="200" y="449" fill="#f85149" font-size="12">not found</text>
  <rect x="470" y="434" width="74" height="21" rx="10.5" fill="#1f6feb"/>
  <text x="507" y="449" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">Install…</text>

  <!-- ── section: Preview &amp; diagrams ── -->
  <text x="32" y="493" fill="#6e7681" font-size="10.5" font-weight="700" letter-spacing="1.2">PREVIEW &amp; DIAGRAMS</text>
  <line x1="32" y1="501" x2="848" y2="501" stroke="#21262d"/>

  <circle cx="40" cy="524" r="5" fill="#3fb950"/>
  <text x="56" y="528" fill="#c9d1d9" font-size="13" font-weight="600">mmdc</text>
  <text x="200" y="528" fill="#8b949e" font-size="12">Mermaid diagrams</text>
  <text x="470" y="528" fill="#6e7681" font-size="11.5">11.4.2</text>

  <!-- stand-in badge -->
  <rect x="762" y="52" width="86" height="22" rx="11" fill="#58a6ff"/>
  <text x="805" y="67" fill="#0d1117" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">STAND-IN</text>
</svg>
