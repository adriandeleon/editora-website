name: Check

# Runs on every pull request (and on demand) so a broken build, a wrong
# command id or chord in the docs, a broken internal link, or a feature page
# edited by hand instead of in its generator is caught before merge. The
# deploy workflow (pages.yml) only runs after merge to master.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install
        run: npm ci

      - name: Feature pages match their generator
        run: |
          java scripts/GenFeatures.java
          git diff --exit-code -- src/content/features \
            || { echo "::error::src/content/features differs from scripts/GenFeatures.java. Edit the generator and re-run it."; exit 1; }

      - name: Command ids and chords in the docs
        run: npm run check:docs

      - name: Build
        run: npm run build

      - name: Internal links and anchors
        run: npm run check:links
