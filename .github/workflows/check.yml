name: Check

# Runs on every pull request (and on demand) so a broken build, a wrong
# command id or chord in the docs, a broken internal link, or a generated page
# (commands, What's new, version, Pauta conformance, features) that no
# longer matches the app is caught before merge. The
# deploy workflow (pages.yml) only runs after merge to master.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install
        run: npm ci

      # Every generator in scripts/ run against Editora at the tag of the release
      # src/lib/version.ts names; fails when a committed page differs. Into master
      # the release must exist; elsewhere (website-next drafts the next release
      # before its tag) a missing tag is reported and skipped.
      - name: Generated pages match the app
        env:
          ALLOW_UNRELEASED: ${{ github.base_ref != 'master' && '--allow-unreleased' || '' }}
        run: |
          npm run check:generated -- $ALLOW_UNRELEASED \
            || { echo "::error::A generated page differs from the app (see the list above). Re-run its generator against the release tag, or edit scripts/GenFeatures.java for a feature page."; exit 1; }

      # npm run build runs check:docs first too; this step names the failure.
      - name: Command ids and chords in the docs
        run: npm run check:docs

      - name: Build
        run: npm run build

      - name: Internal links and anchors
        run: npm run check:links
