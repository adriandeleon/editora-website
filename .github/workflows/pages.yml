name: Deploy website to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site is deployed only when every generated page matches the Editora
  # release it documents (scripts/check-generated.mjs), the build passes (it
  # runs the command-id and chord check, npm run check:docs) and no internal
  # link or anchor is broken (npm run check:links).
  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated pages match the app
        run: node scripts/check-generated.mjs
  build:
    needs: generated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Runs check:docs first, then the Astro build into dist/.
      - name: Build
        run: npm run build
      # A change merged straight to master skips no check: a broken internal
      # link or anchor stops the deploy, as it fails a pull request.
      - name: Internal links and anchors
        run: npm run check:links
      - name: Site size within the GitHub Pages limit
        run: npm run check:size
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
